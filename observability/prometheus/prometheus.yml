global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: nlp-service
    metrics_path: /metrics
    static_configs:
      - targets: ["nlp-service:8000"]

  # Scrape-эндпоинт на frontend перенесён на /api/metrics, чтобы /metrics отдал
  # Grafana (Next.js rewrite'ит /metrics/* в grafana:3000).
  - job_name: frontend
    metrics_path: /api/metrics
    static_configs:
      - targets: ["frontend:3000"]
