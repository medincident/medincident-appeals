x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "25m"
    max-file: "3"

x-healthcheck: &default-healthcheck
  interval: 300s
  timeout: 30s
  retries: 12
  start_period: 20s

services:
  frontend:
    profiles: [prod]
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: frontend
    restart: unless-stopped
    ports:
      - "8082:3000"
    env_file: .env
    networks:
      - ai-medincident
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=medincident-appeals"
    logging: *default-logging

  frontend-dev:
    profiles: [dev]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend-dev
    restart: unless-stopped
    ports:
      - "8082:3000"
    env_file: .env
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_debug_node_modules:/app/node_modules
    networks:
      - ai-medincident
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  backend:
    profiles: [dev, prod]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      App__NatsUrl: ${NATS_URL}
      App__HttpAddr: ${APP_HTTP_ADDR}
      App__ZitadelIssuer: ${ZITADEL_ISSUER}
      ConnectionStrings__AppDb: ${APPDB_CONNECTION_STRING}
      App__Medincident__Enabled: ${MEDINCIDENT_ENABLED:-false}
      App__Medincident__ServerUrl: ${MEDINCIDENT_SERVER_URL}
      App__Medincident__OrgId: ${MEDINCIDENT_ORG_ID:-$CATEGORIES_ORG_ID}
      App__Medincident__NatsUrl: ${MEDINCIDENT_NATS_URL:-nats://backend_nats:4222}
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
    networks:
      - ai-medincident
      # Кросс-стек доступ к backend_nats (события статуса medincident-backend).
      - medincident-bus
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=medincident-appeals"
    logging: *default-logging

  # Публикует категории в NATS KV medincident/categories для AI-сервисов.
  categories-service:
    profiles: [dev, prod]
    build:
      context: ./categories-service
      dockerfile: Dockerfile
    container_name: ai-medincident-categories
    restart: unless-stopped
    environment:
      NATS_URL: ${NATS_URL}
      CATEGORIES_USE_STUB: ${CATEGORIES_USE_STUB}
      CATEGORIES_POLL_SECONDS: ${CATEGORIES_POLL_SECONDS}
      MEDINCIDENT_SERVER_URL: ${MEDINCIDENT_SERVER_URL}
      CATEGORIES_ORG_ID: ${CATEGORIES_ORG_ID}
      ZITADEL_ISSUER: ${ZITADEL_ISSUER}
      CATEGORIES_MACHINE_KEY_PATH: ${CATEGORIES_MACHINE_KEY_PATH}
      CATEGORIES_PROJECT_ID: ${CATEGORIES_PROJECT_ID}
    volumes:
      # Zitadel machine key для service-токена (нужен при CATEGORIES_USE_STUB=false).
      - ${CATEGORIES_MACHINE_KEY_HOST_PATH:-./secrets/key.json}:${CATEGORIES_MACHINE_KEY_PATH:-/app/secrets/key.json}:ro
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - ai-medincident
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=medincident-appeals"
    logging: *default-logging

  # ── NLP Service (rubert-tiny2 + rut5 + MiniLM) ──────────────────────────────
  # поддерживает скейлинг `docker compose up --scale nlp-service=N`.
  nlp-service:
    profiles: [dev, prod]
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NATS_URL: ${NATS_URL}
    volumes:
      - nlp_models:/app/models_cache
      - ./nlp-service/trained_models:/app/trained_models
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)"]
      start_period: 120s   # для загрузки моделей (~368MB)
    networks:
      - ai-medincident
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=medincident-appeals"
    logging: *default-logging

  # ── LLM Service (llama-cpp-python + Qwen3-4B GGUF) ──────────────────────
  llm-service:
    profiles: [llm]
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    container_name: ai-medincident-llm
    restart: unless-stopped
    env_file: .env
    volumes:
      # GGUF-файл кладётся на хосте в ./llm-service/models_cache/gguf/,
      # контейнер берёт модель по LLM_REPO + LLM_QUANT. В образ модель не запекается.
      - ./llm-service/models_cache:/app/models_cache
    # Для настройки GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:11434/health"]
      start_period: 180s   # загрузка GGUF (~2.5GB) в память при старте
    networks:
      - ai-medincident
    logging: *default-logging

  # ── NATS (JetStream с файловым хранилищем на диске) ─────────────────────────
  nats:
    profiles: [dev, prod]
    image: nats:2.10-alpine
    container_name: ai-medincident-nats
    # -js      = JetStream
    # -sd      = storage dir для JetStream (persistent volume)
    # -m 8222  = HTTP monitoring
    command: ["-js", "-sd", "/data", "-m", "8222"]
    restart: unless-stopped
    ports:
      - "4222:4222"
    volumes:
      - nats_data:/data
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
    networks:
      - ai-medincident
    logging: *default-logging

  # ── Postgres для бэкенда (хранилище обращений) ──────────────────────────────
  postgres:
    profiles: [dev, prod]
    image: postgres:16-alpine
    container_name: ai-medincident-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ai-medincident
    logging: *default-logging

  # ── Prometheus: собирает метрики с nlp-service и frontend ───────────────────
  prometheus:
    profiles: [dev, prod]
    image: prom/prometheus:v2.55.1
    container_name: ai-medincident-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./metrics-service/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ai-medincident
    logging: *default-logging

  # ── Grafana: дашборды. Проксируется фронтендом под /metrics. ────────────────
  grafana:
    profiles: [dev, prod]
    image: grafana/grafana:11.4.0
    container_name: ai-medincident-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/metrics/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/appeals-system-health.json"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./metrics-service/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./metrics-service/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ai-medincident
    logging: *default-logging

  watchtower:
    profiles: [dev, prod]
    image: containrrr/watchtower:latest
    container_name: medincident-appeals-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REPO_USER: ${GHCR_USERNAME}
      REPO_PASS: ${GHCR_TOKEN}
      DOCKER_API_VERSION: "1.40"
      WATCHTOWER_SCOPE: "medincident-appeals"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-3600}
      WATCHTOWER_NOTIFICATIONS: ${WATCHTOWER_NOTIFICATIONS:-}
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL:-}
      TZ: ${TZ:-Europe/Moscow}
    networks:
      - ai-medincident
    logging: *default-logging

networks:
  ai-medincident:
    driver: bridge
  # Внешняя сеть стека medincident-backend (где живёт backend_nats).
  medincident-bus:
    external: true
    name: ${MEDINCIDENT_BUS_NETWORK:-prod_default}

volumes:
  postgres_data:   # appeals + любые будущие таблицы backend'а
  nats_data:       # JetStream storage — чтобы appeals не терялись при рестарте
  nlp_models:      # кэш HuggingFace моделей (~368MB)
  prometheus_data: # TSDB метрик (retention 7 дней)
  grafana_data:    # настройки Grafana
  frontend_debug_node_modules: # изолируем musl-бинари от bind-mount'а ./frontend
