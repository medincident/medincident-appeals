# -----------------------------------------------------------------
# Общие настройки логирования для всех сервисов.
# Ограничение размера — чтобы логи не съели диск при долгой работе.
# -----------------------------------------------------------------
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "25m"
    max-file: "3"

# Стандартный healthcheck-ритм: 300s/30s/12/20s — как в zitadel/.
# start_period переопределяется в сервисах, которым нужно больше времени на старт.
x-healthcheck: &default-healthcheck
  interval: 300s
  timeout: 30s
  retries: 12
  start_period: 20s

services:

  # ── NATS (JetStream с файловым хранилищем на диске) ─────────────────────────
  nats:
    image: nats:2.10-alpine
    container_name: ai-medincident-nats
    # -js      = JetStream
    # -sd      = storage dir для JetStream (persistent volume)
    # -m 8222  = HTTP monitoring
    command: ["-js", "-sd", "/data", "-m", "8222"]
    restart: unless-stopped
    ports:
      - "4222:4222"   # чтобы dev-фронтенд вне compose мог коннектиться
    volumes:
      - nats_data:/data
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
    networks:
      - ai-medincident
    logging: *default-logging

  # ── Categories Service — публикует категории в NATS KV и остаётся в живых ──
  # Долгоживущий сервис: публикует на старте, ре-публикует на каждый reconnect
  # к NATS. Нужно чтобы переживать рестарт NATS / пересоздание его volume —
  # иначе nlp-service будет крашиться на "stream not found".
  categories-service:
    build:
      context: ./categories-service
      dockerfile: Dockerfile
    container_name: ai-medincident-categories
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - ai-medincident
    logging: *default-logging

  # ── LLM Service (Ollama + Qwen2.5-3B) ───────────────────────────────────────
  llm-service:
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    container_name: ai-medincident-llm
    restart: unless-stopped
    environment:
      OLLAMA_MODEL: qwen2.5:3b
    volumes:
      - ollama_data:/root/.ollama
    # Раскомментировать когда появится NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:11434/"]
      start_period: 180s   # время на скачивание модели (~2GB)
    networks:
      - ai-medincident
    logging: *default-logging

  # ── AI Backend (Go + Fiber + NATS KV watcher + JetStream consumer) ──────────
  # Потребляет appeals.submit из JetStream, зовёт nlp-service, публикует
  # результат в appeals.result.<id>. Если падает — JetStream доставит сообщение
  # снова при старте (ack_explicit, file storage).
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      NATS_URL: nats://nats:4222
      NLP_SERVICE_URL: http://nlp-service:8000
      HTTP_ADDR: ":8080"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
    networks:
      - ai-medincident
    logging: *default-logging

  # ── NLP Service (rubert-tiny2 + rut5 + MiniLM) ──────────────────────────────
  # container_name не задан — позволяет `docker compose up --scale nlp-service=N`.
  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NATS_URL: nats://nats:4222
    volumes:
      - nlp_models:/app/models_cache
      - ./nlp-service/trained_models:/app/trained_models
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      start_period: 120s   # время на загрузку моделей (~368MB)
    networks:
      - ai-medincident
    logging: *default-logging

  # ── Frontend PROD: multi-stage build, bun native runtime ────────────────────
  frontend:
    profiles: [prod]
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        AUTH_APP_URL: "https://zitadel-medincident.ulbwa.bombomeow.ru"
        AUTH_ORG_ID: "366537916404531205"
        AUTH_CLIENT_ID: "367696885982494726"
        APP_URL: "https://id-medincident.ulbwa.bombomeow.ru"
        AUTH_SECRET: "UCy6Xy3C31ca0TyJ27DWKZ82QzC0Yq7qg+YvBwqjUIQ="
        NEXT_PUBLIC_AUTH_APP_URL: "https://id-medincident.ulbwa.bombomeow.ru"
    container_name: frontend
    restart: unless-stopped
    ports:
      - "8082:3000"
    environment:
      AUTH_APP_URL: "https://zitadel-medincident.ulbwa.bombomeow.ru"
      AUTH_ORG_ID: "366537916404531205"
      AUTH_CLIENT_ID: "367696885982494726"
      APP_URL: "https://id-medincident.ulbwa.bombomeow.ru"
      AUTH_SECRET: "UCy6Xy3C31ca0TyJ27DWKZ82QzC0Yq7qg+YvBwqjUIQ="
      NEXT_PUBLIC_AUTH_APP_URL: "https://id-medincident.ulbwa.bombomeow.ru"
      AUTH_URL: "https://id-medincident.ulbwa.bombomeow.ru"
      NATS_URL: "nats://nats:4222"
    networks:
      - ai-medincident
    depends_on:
      - backend
    logging: *default-logging

  # ── Prometheus: собирает метрики с nlp-service и frontend ───────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ai-medincident-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ai-medincident
    logging: *default-logging

  # ── Grafana: дашборды. Проксируется фронтендом под /metrics. ────────────────
  grafana:
    image: grafana/grafana:11.4.0
    container_name: ai-medincident-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/metrics/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ai-medincident
    logging: *default-logging

networks:
  ai-medincident:
    driver: bridge

volumes:
  nats_data:       # JetStream storage — чтобы appeals не терялись при рестарте
  ollama_data:     # модель Ollama/Qwen (~1.9GB)
  nlp_models:      # кэш HuggingFace моделей (~368MB)
  prometheus_data: # TSDB метрик (retention 7 дней)
  grafana_data:    # настройки Grafana
