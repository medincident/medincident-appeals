[project]
name = "categories-service"
version = "0.2.0"
description = "Publishes incident categories to NATS JetStream KV — stub mocks or real categories polled from medincident-backend"
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.9.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.9.0",
    # runtime-зависимости сгенерированного OpenAPI-клиента (medincident_client)
    "attrs>=24.0.0",
    "python-dateutil>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
