[project]
name = "categories-service"
version = "0.2.0"
description = "Publishes incident categories to NATS JetStream KV — stub mocks or real categories polled from medincident-backend"
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.9.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
