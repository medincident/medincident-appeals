name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ── Gate: only proceed if CI succeeded on a version tag ────────────────────
  gate:
    name: Verify CI passed
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"

  # ── Docker image ────────────────────────────────────────────────────────────
  docker:
    name: Build & Push
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, nlp-service, llm-service, stt-service, categories-service]
        include:
          - service: backend
            context: ./backend
            file: ./backend/Dockerfile
          - service: frontend
            context: ./frontend
            file: ./frontend/Dockerfile.prod
          - service: llm-service
            context: ./llm-service
            file: ./llm-service/Dockerfile
            # llama-cpp-python собирается из исходников; сборка под arm64 через QEMU
            # слишком медленная и нестабильная (OOM/timeout) — только amd64.
            platforms: linux/amd64
          - service: nlp-service
            context: ./nlp-service
            file: ./nlp-service/Dockerfile
          - service: stt-service
            context: ./stt-service
            file: ./stt-service/Dockerfile
          - service: categories-service
            context: ./categories-service
            file: ./categories-service/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tag }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.gate.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.gate.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.gate.outputs.tag, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: ${{ matrix.platforms || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max