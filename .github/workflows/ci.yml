name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  RUFF_VERSION: "0.15.15"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run build

  llm-service:
    name: LLM Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./llm-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv tool run ruff@${{ env.RUFF_VERSION }} check .

  nlp-service:
    name: NLP Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nlp-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv tool run ruff@${{ env.RUFF_VERSION }} check .

  stt-service:
    name: STT Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./stt-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv tool run ruff@${{ env.RUFF_VERSION }} check .

  categories-service:
    name: Categories Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./categories-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv tool run ruff@${{ env.RUFF_VERSION }} check .