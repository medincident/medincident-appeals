[project]
name = "llm-service"
version = "0.1.0"
description = "FastAPI wrapper around Ollama: /analyze + NATS-driven categories + transparent /v1/* proxy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "nats-py>=2.9.0",
    "httpx>=0.27.0",
    "orjson>=3.10.0",
    "pydantic>=2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]
