# Editable install через `uv sync` локально; Docker использует PYTHONPATH=/app.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "service", "benchmarks"]
# paths.py и main.py НЕ включаем в wheel: копия в site-packages сломает
# `Path(__file__)` в paths.py (резолвил бы в site-packages, а не в исходники).
# Editable .pth-файл и так добавляет nlp-service/ в sys.path.

[project]
name = "nlp-service"
version = "0.1.0"
description = "NLP pipeline for processing patient medical incident reports without LLM"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "nats-py>=2.9.0",
    "transformers>=4.46.0",
    "sentence-transformers>=3.3.0",
    "torch>=2.4.0",
    "sentencepiece>=0.2.0",
    "tiktoken>=0.7.0",
    "numpy>=2.0.0",
    "protobuf>=5.0.0",
    "pydantic>=2.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "python-json-logger>=2.0.7",
]

# Docker runtime ставит только dependencies. Train/dev — только для разработки.
[project.optional-dependencies]
train = [
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "scikit-learn>=1.5.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
]
dev = [
    "ruff>=0.7.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["models_cache", "trained_models", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    "B008",
    "SIM108",
    # Кириллица в строках/докстрингах — false positive для русского проекта.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
