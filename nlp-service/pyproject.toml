[project]
name = "nlp-service"
version = "0.1.0"
description = "NLP pipeline for processing patient medical incident reports without LLM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "nats-py>=2.9.0",
    "transformers>=4.46.0",
    "sentence-transformers>=3.3.0",
    "torch>=2.4.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "sentencepiece>=0.2.0",
    "tiktoken>=0.7.0",
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
    "pydantic>=2.0.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "protobuf>=5.0.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
